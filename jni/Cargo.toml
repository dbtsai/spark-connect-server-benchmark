[package]
name = "spark-connect-jni"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "JNI host for the Spark Connect Rust server and direct Spark JVM handlers"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
spark-connect-server = { path = ".." }
futures = "0.3"
arrow = { version = "58", default-features = false, features = ["ipc", "ffi"] }
prost = "0.14"
spark-connect-proto = { package = "apache-spark-connect-proto", git = "https://github.com/dbtsai/spark-connect-rust.git", rev = "87b2b1e817e7384ed63e8b2385f4b5e4a51ad7ce" }
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
tonic = "0.14"

[build-dependencies]
cc = "1"

[profile.dev]
debug = 0
