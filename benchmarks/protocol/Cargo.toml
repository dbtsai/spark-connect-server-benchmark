[package]
name = "spark-connect-protocol-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Execution-free Spark Connect protocol and planning concurrency benchmarks"
build = "build.rs"

[dependencies]
spark-connect-proto = { package = "apache-spark-connect-proto", git = "https://github.com/dbtsai/spark-connect-rust.git", rev = "87b2b1e817e7384ed63e8b2385f4b5e4a51ad7ce" }
spark-connect = { package = "apache-spark-connect", git = "https://github.com/dbtsai/spark-connect-rust.git", rev = "87b2b1e817e7384ed63e8b2385f4b5e4a51ad7ce" }
arrow = { version = "58", default-features = false, features = ["ipc"] }
futures = "0.3"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
uuid = { version = "1", features = ["v4"] }
crc32fast = "1"
libc = "0.2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
tonic-build = "0.14"

[profile.dev]
debug = 0

[profile.release]
strip = false
