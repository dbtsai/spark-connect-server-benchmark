[package]
name = "spark-connect-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Experimental Spark Connect server with DataFusion and Spark JVM backends"

[dependencies]
spark-connect-proto = { package = "apache-spark-connect-proto", git = "https://github.com/dbtsai/spark-connect-rust.git", rev = "87b2b1e817e7384ed63e8b2385f4b5e4a51ad7ce" }
arrow = { version = "58", default-features = false, features = ["ipc"] }
datafusion = { version = "53", default-features = false, features = ["sql"] }
futures = "0.3"
http-body = "1"
http-body-util = "0.1"
prost = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-build = "0.14"

[dev-dependencies]
h2 = "0.4"
spark-connect = { package = "apache-spark-connect", git = "https://github.com/dbtsai/spark-connect-rust.git", rev = "87b2b1e817e7384ed63e8b2385f4b5e4a51ad7ce" }

[profile.dev]
debug = 0

[profile.test]
debug = 0
